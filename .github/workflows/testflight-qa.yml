# Archive a QA-configured Renit iOS build and upload it to TestFlight on every
# merge to main. Local Xcode toolchain on a macOS runner; no EAS.
#
# QA ONLY. The backend host and app env are pinned in the `env:` block below and
# re-checked by scripts/inspect-ios-release.sh, which fails the run if the
# resolved Expo config or the native signing identity drifts. A production build
# is a separate, deliberate workflow — do not point this one at PROD.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect issuer ID
#   ASC_KEY_P8              contents of the AuthKey_<id>.p8 file
#   DIST_CERT_P12_BASE64    Apple Distribution certificate + private key, .p12, base64
#   DIST_CERT_PASSWORD      password the .p12 was exported with
#   PROVISIONING_PROFILE_BASE64  App Store profile for com.renit.app, base64
#   QA_GOOGLE_MAP_API_KEY   optional; the QA Google Maps key the JS side reads
#
# Not automated on purpose: the export-compliance answer and tester-group
# assignment in App Store Connect. Those are a human declaration / a one-time
# group setting, not a CI step.
name: TestFlight QA

on:
  push:
    branches: [main]
    # Nothing under these paths can change the iOS binary or its JS bundle, so
    # a merge that only touches them should not burn a 20-minute macOS build.
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "functions/**"
      - "android/**"
      - "plugins/**"
      - ".claude/**"
      - "**/*.md"
  workflow_dispatch:

# One build at a time, and never cancel an upload that is already in flight.
concurrency:
  group: testflight-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPO_PUBLIC_APP_ENV: QA
  EXPO_PUBLIC_QA_API_HOST: qa-api.toratora.site
  EXPO_PUBLIC_QA_GOOGLE_MAP_API_KEY: ${{ secrets.QA_GOOGLE_MAP_API_KEY }}
  # CocoaPods dies on a non-UTF-8 locale.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  BUNDLE_ID: com.renit.app
  TEAM_ID: 43Q57TAAAQ

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built with an SDK older than the current
      # requirement, so track the newest stable Xcode rather than pinning one.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs patch-package, so the patches in patches/ are applied.
      - name: Install JS dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Import signing certificate and provisioning profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD PROVISIONING_PROFILE_BASE64; do
            [ -n "${!name}" ] || { echo "::error::secret $name is not set"; exit 1; }
          done

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without this codesign blocks on a keychain-access prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # The profile's own name and UUID are the source of truth; the project
          # and export options are pointed at them below, so refreshing the
          # profile only needs the secret updated.
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_ID / ASC_KEY_P8 not set"; exit 1; }
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Read-only: fails the run on QA host / bundle id / team / entitlement /
      # signing-identity drift before any minutes are spent archiving.
      - name: Release preflight
        run: scripts/inspect-ios-release.sh

      # TestFlight rejects a build number it has already seen for this version.
      # A UTC timestamp always increases, and stays above the small numbers used
      # by local Xcode uploads. Info.plist holds a literal CFBundleVersion, so it
      # is set there; this edit exists only in the runner's checkout.
      - name: Set build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Renit/Info.plist
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      # The Release config hard-codes a dated profile name. Retarget it, and the
      # export options, at whichever profile the secret actually contains.
      - name: Point signing at the installed profile
        run: |
          set -euo pipefail
          perl -0pi -e 's/(PROVISIONING_PROFILE_SPECIFIER = )"[^"]+";/$1"$ENV{PROFILE_NAME}";/g' \
            ios/Renit.xcodeproj/project.pbxproj
          grep -q "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";" ios/Renit.xcodeproj/project.pbxproj \
            || { echo "::error::could not retarget PROVISIONING_PROFILE_SPECIFIER"; exit 1; }

          cp ios/ExportOptions-QA-AppStore.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Renit.xcworkspace \
            -scheme Renit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Renit.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # destination=upload in the export options makes this export and upload to
      # App Store Connect in one step, authenticated by the API key.
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Renit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw ios/Renit/Info.plist)"
          {
            echo "### TestFlight QA upload"
            echo "- Version: \`$VERSION\` (build \`$BUILD_NUMBER\`)"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Backend: \`$EXPO_PUBLIC_QA_API_HOST\` (QA)"
            echo "- Next, in App Store Connect: wait for processing, then answer export compliance for this build if prompted."
          } >> "$GITHUB_STEP_SUMMARY"

      # Never leave signing material on a runner, even one that is discarded.
      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -f "${ASC_KEY_PATH:-}"
